  # ---------- 除零保护 / 派生指标 ----------
  - id: ex_nullif_channel_aov
    question: 2026年6月各渠道客单价是多少
    sql: |
      SELECT p.channel_code,
             ROUND((SUM(p.pay_amount) / NULLIF(COUNT(DISTINCT p.order_id), 0))::numeric, 2) AS aov
      FROM data.dwd_payment p
      WHERE p.pay_status = 'success'
        AND p.pay_date BETWEEN '2026-06-01' AND '2026-06-30'
      GROUP BY p.channel_code
      ORDER BY aov DESC
    query_spec:
      metrics: [aov]
      dimensions: [channel]
      time_range: {start: "2026-06-01", end: "2026-06-30"}
      comparison: null
    tags: [客单价, AOV, 渠道, 除零, NULLIF]
    difficulty: medium
    source: manual
    verified: true

