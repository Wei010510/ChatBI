  # ---------- 退货 / 退款（doc_type 以库中数据为准：refund=退货单，return=仅退款单） ----------
  - id: ex_return_rate_by_count
    question: 2026年6月退货率是多少（按单数）
    sql: |
      WITH o AS (
        SELECT COUNT(DISTINCT order_id) AS paid
        FROM data.dwd_payment
        WHERE pay_status = 'success'
          AND pay_date BETWEEN '2026-06-01' AND '2026-06-30'
      ), r AS (
        SELECT COUNT(DISTINCT refund_id) AS refunds
        FROM data.dwd_refund
        WHERE doc_type = 'refund'
          AND refund_date BETWEEN '2026-06-01' AND '2026-06-30'
      )
      SELECT ROUND((100.0 * r.refunds / NULLIF(o.paid, 0))::numeric, 4) AS return_rate_pct
      FROM o, r
    query_spec:
      metrics: [return_rate]
      dimensions: []
      time_range: {start: "2026-06-01", end: "2026-06-30"}
      comparison: null
    tags: [退货率, 按单数, doc_type, 除零]
    difficulty: medium
    source: manual
    verified: true

