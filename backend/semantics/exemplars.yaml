  # ---------- 同比 / 环比 / 两期对比 ----------
  - id: ex_yoy_gmv_promo
    question: 2026年618大促 GMV 同比去年是多少
    sql: |
      WITH cur AS (
        SELECT SUM(pay_amount) AS v
        FROM data.dwd_payment
        WHERE pay_status = 'success'
          AND pay_date BETWEEN '2026-06-16' AND '2026-06-18'
      ), prev AS (
        SELECT SUM(pay_amount) AS v
        FROM data.dwd_payment
        WHERE pay_status = 'success'
          AND pay_date BETWEEN '2025-06-16' AND '2025-06-18'
      )
      SELECT '本期' AS period, cur.v AS v, prev.v AS prev_v,
             ROUND(((cur.v - prev.v) / NULLIF(prev.v, 0))::numeric, 4) AS yoy
      FROM cur, prev
    query_spec:
      metrics: [gmv]
      dimensions: []
      time_range: {start: "2026-06-16", end: "2026-06-18"}
      comparison: {type: yoy}
    tags: [同比, yoy, 大促, 时间窗, GMV]
    difficulty: medium
    source: manual
    verified: true

