  # ---------- TopN / 分维度 ----------
  - id: ex_topn_channel_gmv
    question: 2026年6月 GMV 最高的3个渠道
    sql: |
      SELECT p.channel_code, c.channel_name, SUM(p.pay_amount) AS gmv
      FROM data.dwd_payment p
      JOIN data.dim_channel c ON c.channel_code = p.channel_code
      WHERE p.pay_status = 'success'
        AND p.pay_date BETWEEN '2026-06-01' AND '2026-06-30'
      GROUP BY p.channel_code, c.channel_name
      ORDER BY gmv DESC
      LIMIT 3
    query_spec:
      metrics: [gmv]
      dimensions: [channel]
      time_range: {start: "2026-06-01", end: "2026-06-30"}
      comparison: null
    tags: [TopN, 排名, 渠道, GMV]
    difficulty: easy
    source: manual
    verified: true

  - id: ex_channel_gmv
