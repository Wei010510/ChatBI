  # ---------- 大促窗口（档期来自 dim_promotion，不写死口径） ----------
  - id: ex_promotion_window_gmv
    question: 2026年大促和预热期的 GMV 分别是多少
    sql: |
      SELECT pr.promotion_name, pr.promotion_type, pr.start_date, pr.end_date,
             SUM(p.pay_amount) AS gmv
      FROM data.dwd_payment p
      JOIN data.dim_promotion pr
        ON p.pay_date BETWEEN pr.start_date AND pr.end_date
      WHERE p.pay_status = 'success'
        AND pr.promotion_type IN ('大促', '预热')
      GROUP BY pr.promotion_name, pr.promotion_type, pr.start_date, pr.end_date
      ORDER BY pr.start_date
    query_spec:
      metrics: [gmv]
      dimensions: []
      time_range: {start: "2025-06-16", end: "2026-06-18"}
      comparison: null
    tags: [大促, 预热, 时间窗, 档期, GMV]
    difficulty: medium
    source: manual
    verified: true

  # ---------- 转化率 ----------
  - id: ex_order_conversion_rate
    question: 2026年6月下单转化率是多少
    sql: |
      WITH e AS (
        SELECT SUM(exposure_count) AS exposure
        FROM data.dwd_exposure_daily
        WHERE stat_date BETWEEN '2026-06-01' AND '2026-06-30'
      ), o AS (
        SELECT COUNT(DISTINCT order_id) AS orders
        FROM data.dwd_order
        WHERE order_date BETWEEN '2026-06-01' AND '2026-06-30'
      )
      SELECT ROUND((100.0 * o.orders / NULLIF(e.exposure, 0))::numeric, 4) AS order_conversion_pct
      FROM e, o
    query_spec:
      metrics: [conversion_rate]
      dimensions: []
      time_range: {start: "2026-06-01", end: "2026-06-30"}
      comparison: null
    tags: [转化率, 下单转化, 除零]
    difficulty: medium
    source: manual
    verified: true

  - id: ex_pay_conversion_rate
    question: 2026年6月支付转化率是多少
    sql: |
      WITH e AS (
        SELECT SUM(uv) AS uv
        FROM data.dwd_exposure_daily
        WHERE stat_date BETWEEN '2026-06-01' AND '2026-06-30'
      ), p AS (
        SELECT COUNT(DISTINCT order_id) AS paid
        FROM data.dwd_payment
        WHERE pay_status = 'success'
          AND pay_date BETWEEN '2026-06-01' AND '2026-06-30'
      )
      SELECT ROUND((100.0 * p.paid / NULLIF(e.uv, 0))::numeric, 4) AS pay_conversion_pct
      FROM e, p
    query_spec:
