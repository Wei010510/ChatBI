  # ---------- 新客占比 ----------
  - id: ex_new_customer_gmv_ratio
    question: 2026年6月新客 GMV 占比是多少
    sql: |
      WITH p AS (
        SELECT p.pay_amount, c.first_pay_date
        FROM data.dwd_payment p
        JOIN data.dim_customer c ON c.customer_id = p.customer_id
        WHERE p.pay_status = 'success'
          AND p.pay_date BETWEEN '2026-06-01' AND '2026-06-30'
      )
      SELECT ROUND(
          (100.0 * SUM(pay_amount) FILTER (
              WHERE first_pay_date BETWEEN '2026-06-01' AND '2026-06-30'
          ) / NULLIF(SUM(pay_amount), 0))::numeric,
          4
      ) AS new_customer_gmv_pct
      FROM p
    query_spec:
      metrics: [new_customer_gmv_ratio]
      dimensions: [is_new_customer]
      time_range: {start: "2026-06-01", end: "2026-06-30"}
      comparison: null
    tags: [新客, 新老客, 占比, 除零]
    difficulty: hard
    source: manual
    verified: true
