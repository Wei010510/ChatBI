services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-chatbi}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-chatbi}"
      POSTGRES_DB: "${POSTGRES_DB:-chatbi}"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatbi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://chatbi:chatbi@db:5432/chatbi}"
      DATABASE_RO_URL: "${DATABASE_RO_URL:-postgresql+psycopg://chatbi_ro:chatbi_ro@db:5432/chatbi}"
      DATABASE_META_URL: "${DATABASE_META_URL:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      MODEL_SMALL: "${MODEL_SMALL:-qwen3.8-flash}"
      MODEL_STRONG: "${MODEL_STRONG:-qwen3.8-flash}"
      MODEL_MID: "${MODEL_MID:-qwen3.8-flash}"
      EMBEDDING_BASE_URL: "${EMBEDDING_BASE_URL:-}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-qwen3.7-text-embedding}"
      EMBED_DIM: "${EMBED_DIM:-1024}"
      QUERY_TIMEOUT_MS: "${QUERY_TIMEOUT_MS:-5000}"
      MAX_ROWS: "${MAX_ROWS:-1000}"
      CACHE_TTL_SECONDS: "${CACHE_TTL_SECONDS:-604800}"
      PGVECTOR_ENABLED: "${PGVECTOR_ENABLED:-auto}"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
